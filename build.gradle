plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'recorder'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// ./gradlew exportRecording -Pmcrc=<path/to/recording.mcrc> writes <recording>.jsonl next to it, without starting the game
tasks.register('exportRecording', JavaExec) {
    group = 'recorder'
    description = 'Decodes every row of -Pmcrc=<recording.mcrc> into <recording>.jsonl next to it'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.toshimichi.recorder.JsonlExport'
    args = [providers.gradleProperty('mcrc').getOrElse('')]
    // the game's logs/ go where runClient's do, not into the project
    def runDir = file('run')
    workingDir = runDir
    doFirst { runDir.mkdirs() }
}

processResources {
    def version = project.version
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// the release workflow uploads a fixed name
jar {
    archiveFileName = 'recorder.jar'
}
